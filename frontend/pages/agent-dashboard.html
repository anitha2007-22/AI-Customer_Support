<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard — SupportDesk</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar-root"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar-root"></header>
    <main class="page-content">

      <!-- Stats -->
      <div class="stats-grid" id="agentStats">
        <div class="stat-card loading-skeleton" style="height:110px"></div>
        <div class="stat-card loading-skeleton" style="height:110px"></div>
        <div class="stat-card loading-skeleton" style="height:110px"></div>
        <div class="stat-card loading-skeleton" style="height:110px"></div>
      </div>

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:4px">
        <!-- Assigned Tickets -->
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">Assigned Tickets</div>
              <div class="card-subtitle">Tickets requiring your attention</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <select id="statusFilter" class="form-control" style="width:auto;font-size:13px" onchange="filterTickets()">
                <option value="">All Status</option>
                <option value="Open">Open</option>
                <option value="In Progress">In Progress</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
          <div id="assignedTickets">
            <div style="padding:32px;text-align:center;color:var(--text-muted)">Loading...</div>
          </div>
        </div>

        <!-- Quick Stats Panel -->
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card">
            <div class="card-title" style="margin-bottom:16px">My Performance</div>
            <div id="performancePanel">
              <div style="padding:20px;text-align:center;color:var(--text-muted)">Loading...</div>
            </div>
          </div>

          <div class="card">
            <div class="card-title" style="margin-bottom:12px">Critical Tickets</div>
            <div id="criticalTickets">
              <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:16px">Loading...</div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  initPage('agent', 'My Dashboard');
  let allTickets = [];

  async function loadAgentDashboard() {
    const res = await API.getTickets({ limit: 50 });
    if (!res?.ok) return;

    allTickets = res.data.data;
    const open = allTickets.filter(t => t.status === 'Open').length;
    const inProgress = allTickets.filter(t => t.status === 'In Progress').length;
    const pending = allTickets.filter(t => t.status === 'Pending').length;
    const resolved = allTickets.filter(t => ['Resolved','Closed'].includes(t.status)).length;

    document.getElementById('agentStats').innerHTML = `
      <div class="stat-card" style="--card-accent:#3B82F6;--card-accent-bg:#DBEAFE">
        <div class="stat-icon">📂</div>
        <div class="stat-value">${open}</div>
        <div class="stat-label">Open</div>
      </div>
      <div class="stat-card" style="--card-accent:#8B5CF6;--card-accent-bg:#EDE9FE">
        <div class="stat-icon">⚡</div>
        <div class="stat-value">${inProgress}</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-card" style="--card-accent:#F59E0B;--card-accent-bg:#FEF3C7">
        <div class="stat-icon">⏳</div>
        <div class="stat-value">${pending}</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card" style="--card-accent:#10B981;--card-accent-bg:#D1FAE5">
        <div class="stat-icon">✅</div>
        <div class="stat-value">${resolved}</div>
        <div class="stat-label">Resolved</div>
      </div>
    `;

    renderTickets(allTickets);
    renderPerformance(allTickets);
    renderCritical(allTickets);
  }

  function filterTickets() {
    const status = document.getElementById('statusFilter').value;
    const filtered = status ? allTickets.filter(t => t.status === status) : allTickets;
    renderTickets(filtered);
  }

  function renderTickets(tickets) {
    const active = tickets.filter(t => !['Resolved','Closed'].includes(t.status));
    const container = document.getElementById('assignedTickets');

    if (!active.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🎉</div>
          <h3>All clear!</h3>
          <p>No tickets need your attention right now.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = active.map(t => {
      const sla = getSLAStatus(t.sla?.dueDate, t.status);
      return `
        <div class="ticket-card priority-${t.priority.toLowerCase()}" onclick="window.location='ticket-detail.html?id=${t._id}'">
          <div class="ticket-card-header">
            <div>
              <div class="ticket-card-id">${t.ticketId}</div>
              <div class="ticket-card-title">${escapeHtml(t.title)}</div>
            </div>
            <div style="text-align:right">
              ${getStatusBadge(t.status)}
              <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${escapeHtml(t.customerName || '—')}</div>
            </div>
          </div>
          <div class="ticket-card-meta">
            ${getPriorityBadge(t.priority)}
            <span style="font-size:12px;color:var(--text-muted)">📂 ${t.category}</span>
            <span style="font-size:12px;color:var(--${sla.cls === 'overdue' ? 'danger' : sla.cls === 'warning' ? 'warning' : 'text-muted'});font-weight:600;margin-left:auto">⏰ ${sla.label}</span>
          </div>
          ${t.sla?.dueDate ? `
            <div class="sla-bar-container" style="margin-top:8px">
              <div class="sla-bar ${sla.cls}" style="width:${getSLAPercent(t.sla.dueDate, t.createdAt)}%"></div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  function getSLAPercent(dueDate, createdAt) {
    const total = new Date(dueDate) - new Date(createdAt);
    const elapsed = Date.now() - new Date(createdAt);
    return Math.min(100, Math.max(0, (elapsed / total) * 100));
  }

  function renderPerformance(tickets) {
    const resolved = tickets.filter(t => ['Resolved','Closed'].includes(t.status));
    const total = tickets.length;
    const rate = total > 0 ? Math.round((resolved.length / total) * 100) : 0;
    const rated = tickets.filter(t => t.satisfactionRating);
    const avgRating = rated.length > 0
      ? (rated.reduce((a, t) => a + t.satisfactionRating, 0) / rated.length).toFixed(1)
      : null;

    document.getElementById('performancePanel').innerHTML = `
      <div style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
          <span style="color:var(--text-secondary)">Resolution Rate</span>
          <span style="font-weight:700">${rate}%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ${rate >= 80 ? 'success' : rate >= 50 ? 'warning' : 'danger'}" style="width:${rate}%"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span style="color:var(--text-secondary)">Total Assigned</span>
        <span style="font-weight:700">${total}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span style="color:var(--text-secondary)">Resolved</span>
        <span style="font-weight:700;color:var(--success)">${resolved.length}</span>
      </div>
      ${avgRating ? `
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span style="color:var(--text-secondary)">Avg Satisfaction</span>
          <span style="font-weight:700;color:var(--warning)">⭐ ${avgRating}/5</span>
        </div>
      ` : ''}
    `;
  }

  function renderCritical(tickets) {
    const critical = tickets.filter(t => t.priority === 'Critical' && !['Resolved','Closed'].includes(t.status));
    const container = document.getElementById('criticalTickets');
    if (!critical.length) {
      container.innerHTML = '<div style="text-align:center;font-size:13px;color:var(--success);padding:8px">✅ No critical tickets</div>';
      return;
    }
    container.innerHTML = critical.slice(0, 5).map(t => `
      <div style="padding:10px;border-radius:6px;background:var(--danger-light);margin-bottom:8px;cursor:pointer" onclick="window.location='ticket-detail.html?id=${t._id}'">
        <div style="font-size:12px;font-weight:700;color:var(--danger)">${t.ticketId}</div>
        <div style="font-size:13px;font-weight:500;margin-top:2px">${escapeHtml(t.title)}</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${timeAgo(t.createdAt)}</div>
      </div>
    `).join('');
  }

  loadAgentDashboard();
</script>
</body>
</html>
