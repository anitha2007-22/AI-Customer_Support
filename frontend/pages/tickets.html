<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="http://127.0.0.1:5000/api">
  <title>Tickets — SupportDesk</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar-root"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar-root"></header>
    <main class="page-content">

      <!-- Filters Bar -->
      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <div class="search-bar" style="flex:1;min-width:200px">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="form-control" placeholder="Search by ID, title, or customer..." oninput="debounceSearch()">
          </div>
          <div>
            <select id="statusFilter" class="form-control" style="width:auto" onchange="loadTickets()">
              <option value="">All Status</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Pending">Pending</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div>
            <select id="priorityFilter" class="form-control" style="width:auto" onchange="loadTickets()">
              <option value="">All Priority</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
          <div>
            <select id="categoryFilter" class="form-control" style="width:auto" onchange="loadTickets()">
              <option value="">All Categories</option>
              <option value="Technical Issue">Technical</option>
              <option value="Billing Issue">Billing</option>
              <option value="Account Issue">Account</option>
              <option value="General Inquiry">General</option>
            </select>
          </div>
          <div style="display:flex;gap:6px">
            <input type="date" id="startDate" class="form-control" style="width:auto" onchange="loadTickets()">
            <input type="date" id="endDate" class="form-control" style="width:auto" onchange="loadTickets()">
          </div>
          <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear</button>
        </div>
      </div>

      <!-- Results Info + New Ticket Button -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:14px;color:var(--text-muted)">
          <span id="resultsInfo">Loading...</span>
        </div>
        <div style="display:flex;gap:8px">
          <div style="display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px">
            <button class="btn btn-sm active" id="viewTableBtn" onclick="switchView('table')" style="background:var(--primary);color:white">📋 Table</button>
            <button class="btn btn-sm" id="viewCardsBtn" onclick="switchView('cards')">🗂️ Cards</button>
          </div>
          <a href="create-ticket.html" class="btn btn-primary btn-sm" id="newTicketBtn" style="display:none">+ New Ticket</a>
        </div>
      </div>

      <!-- Tickets Container -->
      <div id="ticketsContainer">
        <div style="padding:60px;text-align:center;color:var(--text-muted)">Loading tickets...</div>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="pagination"></div>

    </main>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  const user = Auth.getUser();
  const role = user?.role || 'customer';
  initPage(role, 'Tickets');

  // Show New Ticket for customers
  if (role === 'customer') document.getElementById('newTicketBtn').style.display = 'inline-flex';

  let currentPage = 1;
  let currentView = 'table';
  let searchTimer;

  function debounceSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadTickets, 400);
  }

  function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('priorityFilter').value = '';
    document.getElementById('categoryFilter').value = '';
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    currentPage = 1;
    loadTickets();
  }

  function switchView(v) {
    currentView = v;
    document.getElementById('viewTableBtn').style.cssText = v === 'table' ? 'background:var(--primary);color:white' : '';
    document.getElementById('viewCardsBtn').style.cssText = v === 'cards' ? 'background:var(--primary);color:white' : '';
    loadTickets();
  }

  async function loadTickets() {
    const params = {
      page: currentPage,
      limit: 15,
      search: document.getElementById('searchInput').value.trim(),
      status: document.getElementById('statusFilter').value,
      priority: document.getElementById('priorityFilter').value,
      category: document.getElementById('categoryFilter').value,
      startDate: document.getElementById('startDate').value,
      endDate: document.getElementById('endDate').value,
    };
    // Remove empty params
    Object.keys(params).forEach(k => !params[k] && delete params[k]);

    const container = document.getElementById('ticketsContainer');
    container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted)">Loading...</div>';

    const res = await API.getTickets(params);
    if (!res?.ok) {
      container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger)">Failed to load tickets</div>';
      return;
    }

    const { data: tickets, total, pages } = res.data;
    document.getElementById('resultsInfo').textContent = `${total} ticket${total !== 1 ? 's' : ''} found`;

    if (!tickets.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🎫</div>
          <h3>No tickets found</h3>
          <p>Try adjusting your filters or search terms.</p>
          ${role === 'customer' ? '<a href="create-ticket.html" class="btn btn-primary">Create First Ticket</a>' : ''}
        </div>
      `;
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    if (currentView === 'table') {
      container.innerHTML = renderTableView(tickets);
    } else {
      container.innerHTML = renderCardsView(tickets);
    }

    renderPagination(pages);
  }

  function renderTableView(tickets) {
    const isAdminOrAgent = role === 'admin' || role === 'agent';
    return `
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Ticket ID</th>
              <th>Title</th>
              ${isAdminOrAgent ? '<th>Customer</th>' : ''}
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Agent</th>
              <th>SLA</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody>
            ${tickets.map(t => {
              const sla = getSLAStatus(t.sla?.dueDate, t.status);
              return `
                <tr onclick="window.location='ticket-detail.html?id=${t._id}'">
                  <td><span style="font-family:var(--font-mono);font-size:12px;color:var(--primary)">${t.ticketId}</span></td>
                  <td>
                    <div style="font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(t.title)}</div>
                    ${t.messages?.length ? `<div style="font-size:11px;color:var(--text-muted)">💬 ${t.messages.filter(m=>!m.isInternal).length} message(s)</div>` : ''}
                  </td>
                  ${isAdminOrAgent ? `<td>${escapeHtml(t.customerName || '—')}</td>` : ''}
                  <td><span style="font-size:12px">${t.category}</span></td>
                  <td>${getPriorityBadge(t.priority)}</td>
                  <td>${getStatusBadge(t.status)}</td>
                  <td style="font-size:13px">${escapeHtml(t.agentName || '—')}</td>
                  <td>
                    <span style="font-size:12px;font-weight:600;color:var(--${sla.cls === 'overdue' ? 'danger' : sla.cls === 'warning' ? 'warning' : 'text-muted'})">${sla.label}</span>
                  </td>
                  <td style="color:var(--text-muted);font-size:12px;white-space:nowrap">${timeAgo(t.createdAt)}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderCardsView(tickets) {
    return `<div>${tickets.map(t => `
      <div class="ticket-card priority-${t.priority.toLowerCase()}" onclick="window.location='ticket-detail.html?id=${t._id}'">
        <div class="ticket-card-header">
          <div>
            <div class="ticket-card-id">${t.ticketId}</div>
            <div class="ticket-card-title">${escapeHtml(t.title)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${getStatusBadge(t.status)}
            ${getPriorityBadge(t.priority)}
          </div>
        </div>
        <div class="ticket-card-desc">${escapeHtml(t.description)}</div>
        <div class="ticket-card-meta">
          <span style="font-size:12px;color:var(--text-muted)">📂 ${t.category}</span>
          <span style="font-size:12px;color:var(--text-muted)">·</span>
          <span style="font-size:12px;color:var(--text-muted)">👤 ${escapeHtml(t.customerName || '—')}</span>
          <span style="font-size:12px;color:var(--text-muted)">·</span>
          <span style="font-size:12px;color:var(--text-muted)">🕐 ${timeAgo(t.createdAt)}</span>
          ${t.messages?.length ? `<span style="margin-left:auto;font-size:12px;color:var(--primary)">💬 ${t.messages.filter(m=>!m.isInternal).length}</span>` : ''}
        </div>
      </div>
    `).join('')}</div>`;
  }

  function renderPagination(totalPages) {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goToPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 3) {
        html += `<span style="padding:0 4px;color:var(--text-muted)">…</span>`;
      }
    }
    html += `<button class="page-btn" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
    pag.innerHTML = html;
  }

  function goToPage(page) {
    currentPage = page;
    loadTickets();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  loadTickets();
</script>
</body>
</html>
