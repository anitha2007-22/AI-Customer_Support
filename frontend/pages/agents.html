<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base" content="https://ai-customer-support-azdn.onrender.com/api">
  <title>Agents — SupportDesk</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar-root"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar-root"></header>
    <main class="page-content">

      <div id="agentCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:24px">
        <div class="stat-card loading-skeleton" style="height:220px"></div>
        <div class="stat-card loading-skeleton" style="height:220px"></div>
        <div class="stat-card loading-skeleton" style="height:220px"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Agent Leaderboard</div>
        </div>
        <div class="table-container" style="border:none">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Agent</th>
                <th>Department</th>
                <th>Assigned</th>
                <th>Resolved</th>
                <th>Resolution Rate</th>
                <th>Avg Satisfaction</th>
              </tr>
            </thead>
            <tbody id="agentTableBody">
              <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  initPage('admin', 'Agent Management');

  async function loadAgents() {
    const res = await API.getAgentPerformance();
    if (!res?.ok) return;

    const agents = res.data.data;

    // Agent Cards
    document.getElementById('agentCards').innerHTML = agents.length === 0
      ? '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🛠️</div><h3>No agents found</h3><p>Add agents by creating agent accounts.</p></div>'
      : agents.map((a, i) => {
          const medal = ['🥇','🥈','🥉'][i] || '🎖️';
          const rateColor = a.resolutionRate >= 80 ? 'var(--success)' : a.resolutionRate >= 50 ? 'var(--warning)' : 'var(--danger)';
          return `
            <div class="card" style="position:relative;overflow:visible">
              <div style="position:absolute;top:-10px;right:16px;font-size:28px">${medal}</div>
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
                <div class="avatar" style="background:var(--accent);width:48px;height:48px;font-size:18px">
                  ${getInitials(a.name)}
                </div>
                <div>
                  <div style="font-weight:700;font-size:16px">${escapeHtml(a.name)}</div>
                  <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(a.department || 'General Support')}</div>
                  <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(a.email)}</div>
                </div>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
                <div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px">
                  <div style="font-size:22px;font-weight:800;color:var(--primary)">${a.assignedTickets}</div>
                  <div style="font-size:11px;color:var(--text-muted)">Assigned</div>
                </div>
                <div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px">
                  <div style="font-size:22px;font-weight:800;color:var(--success)">${a.resolvedTickets}</div>
                  <div style="font-size:11px;color:var(--text-muted)">Resolved</div>
                </div>
              </div>
              <div style="margin-bottom:8px">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
                  <span style="color:var(--text-muted)">Resolution Rate</span>
                  <span style="font-weight:700;color:${rateColor}">${a.resolutionRate}%</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill ${a.resolutionRate >= 80 ? 'success' : a.resolutionRate >= 50 ? 'warning' : 'danger'}" style="width:${a.resolutionRate}%"></div>
                </div>
              </div>
              ${a.avgSatisfaction ? `
                <div style="text-align:center;font-size:13px;margin-top:10px;color:var(--warning)">
                  ${'⭐'.repeat(Math.round(a.avgSatisfaction))} ${a.avgSatisfaction}/5 avg rating
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

    // Table
    document.getElementById('agentTableBody').innerHTML = agents.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted)">No agents found</td></tr>'
      : agents.map((a, i) => `
        <tr>
          <td style="font-weight:800;font-size:18px">${['🥇','🥈','🥉'][i] || (i+1)}</td>
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <div class="avatar avatar-sm" style="background:var(--accent)">${getInitials(a.name)}</div>
              <div>
                <div style="font-weight:600">${escapeHtml(a.name)}</div>
                <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(a.email)}</div>
              </div>
            </div>
          </td>
          <td style="font-size:13px;color:var(--text-muted)">${escapeHtml(a.department || '—')}</td>
          <td>${a.assignedTickets}</td>
          <td><span style="color:var(--success);font-weight:600">${a.resolvedTickets}</span></td>
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="progress-bar" style="width:80px">
                <div class="progress-fill ${a.resolutionRate>=80?'success':a.resolutionRate>=50?'warning':'danger'}" style="width:${a.resolutionRate}%"></div>
              </div>
              <span style="font-weight:700">${a.resolutionRate}%</span>
            </div>
          </td>
          <td>${a.avgSatisfaction ? `<span style="color:var(--warning);font-weight:700">⭐ ${a.avgSatisfaction}</span>` : '—'}</td>
        </tr>
      `).join('');
  }

  loadAgents();
</script>
</body>
</html>
